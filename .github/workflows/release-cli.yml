name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: The tag name to release the CLI to, e.g. v1.0.0
        required: true
        type: string
      version:
        description: The full semantic version of the CLI to release, e.g. 1.0.0
        required: true
        type: string
    secrets:
      AZ_DEVOPS_FEED:
        required: true
      AZ_DEVOPS_USERNAME:
        required: true
      AZ_DEVOPS_PASSWORD:
        required: true

env:
  ARTIFACT_NAME: package
  DOTNET_VERSION: 10.0.x

permissions:
  actions: read
  checks: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print Environment Variables
        uses: milkyware/actions/print-env-vars@80896ed5b85db760fdf63b73335fa437705b3c8c # print-env-vars-v0.0.2

      - name: Shorten Git Hash
        id: shorten-git-hash
        uses: milkyware/actions/short-sha@f936f72f37f4d2e8081e9de6b380a7140a2d9abb # short-sha-v0.0.2

      - name: Setup Dotnet
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Dotnet Version
        id: dotnet-version
        run: dotnet --version

      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REVISION_ID: ${{ steps.shorten-git-hash.outputs.hash }}
          SOURCE_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          dotnet pack ./src/MilkyWare.Wam.Cli -o ${{ runner.temp }}/nupkg `
            -p:Version="$env:VERSION" `
            -p:SourceRevisionId="$env:SOURCE_REVISION_ID" `
            -p:SourceBranchName="$env:SOURCE_BRANCH_NAME"

      - name: Upload Artifact
        id: upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: 
          name: ${{ env.ARTIFACT_NAME}}
          path: ${{ runner.temp }}/nupkg/*.nupkg

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print Environment Variables
        uses: milkyware/actions/print-env-vars@80896ed5b85db760fdf63b73335fa437705b3c8c # print-env-vars-v0.0.2

      - name: Download Artifact
        id: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Upload Asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          DOWNLOAD_PATH: ${{ steps.download-artifact.outputs.download-path }}
        run: |
          gh release upload "$env:TAG_NAME" `
            "$env:DOWNLOAD_PATH/*.nupkg" `
            --repo ${{ github.repository }} `
            --clobber


  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print Environment Variables
        uses: milkyware/actions/print-env-vars@80896ed5b85db760fdf63b73335fa437705b3c8c # print-env-vars-v0.0.2

      - name: Download Artifact
        id: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Setup Dotnet
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add Nuget Source
        shell: pwsh
        env:
          AZ_DEVOPS_FEED: ${{ secrets.AZ_DEVOPS_FEED }}
          AZ_DEVOPS_USERNAME: ${{ secrets.AZ_DEVOPS_USERNAME }}
          AZ_DEVOPS_PASSWORD: ${{ secrets.AZ_DEVOPS_PASSWORD }}
        run: |
          dotnet nuget add source $env:AZ_DEVOPS_FEED `
            --name MilkyWare --username $env:AZ_DEVOPS_USERNAME `
            --password $env:AZ_DEVOPS_PASSWORD `
            --store-password-in-clear-text

      - name: Nuget Push
        shell: pwsh
        env:
          DOWNLOAD_PATH: ${{ steps.download-artifact.outputs.download-path }}
        run: |
          if ($env:RUNNER_DEBUG)
          {
              $VerbosePreference = "Continue"
          }
          $path = "$env:DOWNLOAD_PATH/*.nupkg"
          Write-Verbose "path=$path"
          $output = dotnet nuget push $path --source MilkyWare --skip-duplicate --api-key dummy
          if ($LASTEXITCODE) {
            $message = $output -match "error:.*"
            throw $message
          }
          $output
