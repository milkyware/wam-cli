name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: The tag name to release the CLI to, e.g. v1.0.0
        required: true
        type: string
      version:
        description: The full semantic version of the CLI to release, e.g. 1.0.0
        required: true
        type: string
    secrets:
      NUGET_USERNAME:
        required: true

env:
  ARTIFACT_NAME: package
  DOTNET_VERSION: 10.0.x

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shorten Git Hash
        id: shorten-git-hash
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          "hash=$sha" >> $env:GITHUB_OUTPUT

      - name: Build Dotnet
        uses: $/.github/actions/build-dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REVISION_ID: ${{ steps.shorten-git-hash.outputs.hash }}
          SOURCE_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          dotnet pack ./src/MilkyWare.Wam.Cli -o ${{ runner.temp }}/nupkg `
            -p:Version="$env:VERSION" `
            -p:SourceRevisionId="$env:SOURCE_REVISION_ID" `
            -p:SourceBranchName="$env:SOURCE_BRANCH_NAME" `
            --no-restore

      - name: Upload Artifact
        id: upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/nupkg/*.nupkg

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        id: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Upload Asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          DOWNLOAD_PATH: ${{ steps.download-artifact.outputs.download-path }}
        run: |
          gh release upload "$env:TAG_NAME" `
            "$env:DOWNLOAD_PATH/*.nupkg" `
            --repo ${{ github.repository }} `
            --clobber

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Artifact
        id: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Setup Dotnet
        id: setup-dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Nuget Login
        id: nuget-login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Nuget Push
        shell: pwsh
        env:
          DOWNLOAD_PATH: ${{ steps.download-artifact.outputs.download-path }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ($env:RUNNER_DEBUG)
          {
              $VerbosePreference = "Continue"
          }
          $path = "$env:DOWNLOAD_PATH/*.nupkg"
          Write-Verbose "path=$path"
          $output = dotnet nuget push $path --skip-duplicate --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE) {
            $message = $output -match "error:.*"
            throw $message
          }
          $output
