name: CI

on:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions: 
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: milkyware/actions/build-dotnet@build-dotnet-v0.0.8
        with:
          skip-tests: true